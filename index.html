</style></head><body><header><strong>Pripremio Abdo ef. Rekić</strong><h1>Ilmihal 3 · Džennet i Džehennem</h1><nav><button onclick="show('lesson')">Lekcija</button><button onclick="startQuiz()">Kviz</button><button onclick="startCards()">Kartice</button><button onclick="startMatch()">Spoji</button><button onclick="startMemory()">Memori</button><button onclick="document.documentElement.requestFullscreen?.()">Cijeli ekran</button><button onclick="downloadSelf()">Preuzmi HTML</button></nav></header><main><div id="view"></div></main><footer><a class="btn" href="https://rekicabdo-bihac.github.io/mektebski-portal/">Digitalni mektebski centar</a><p>Medžlis IZ Bihać · Pripremio Abdo ef. Rekić</p></footer><script>const data=[{"q": "Šta je ahiret?", "a": "Drugi svijet.", "w": ["Prolazni svijet.", "Vodeni svijet.", "Ovaj svijet."]}, {"q": "Kako se u lekciji opisuje dunjaluk?", "a": "Kao putovanje prema ahiretu.", "w": ["Kao vječno konačno boravište.", "Kao mjesto bez iskušenja.", "Kao život poslije proživljenja."]}, {"q": "Šta je Džennet?", "a": "Vječno boravište na ahiretu pripremljeno za vjernike.", "w": ["Privremeno boravište svih ljudi.", "Mjesto kažnjavanja nevjernika.", "Mjesto okupljanja na Mahšeru."]}, {"q": "Šta je Džehennem?", "a": "Boravište na ahiretu pripremljeno za nevjernike, nasilnike i zločince.", "w": ["Vječna nagrada za dobra djela.", "Najviši stepen nagrade.", "Vrelo iz kojeg će piti vjernici."]}, {"q": "Ko će stići do Dženneta poslije Sirat-ćuprije?", "a": "Oni koji uspješno pređu Sirat-ćupriju.", "w": ["Svi bez obzira na prelazak.", "Samo oni koji su bili bogati.", "Samo ljudi koji su živjeli u Mekki."]}, {"q": "Šta se nalazi u Džennetu?", "a": "Rijeke i prostrane odaje.", "w": ["Samo pustinje i suha zemlja.", "Vatra i lanci.", "Samo zemaljske kuće."]}, {"q": "Kakav je život u Džennetu?", "a": "Ugodan, bez poteškoća.", "w": ["Pun patnje i neprekidnog straha.", "Prolazan kao dunjaluk.", "Bez ikakvih blagodati."]}, {"q": "Šta će vjernici u Džennetu moći dobiti?", "a": "Sve što požele.", "w": ["Samo ono što su imali na dunjaluku.", "Samo hranu bez drugih blagodati.", "Samo ono što drugi ljudi odaberu."]}, {"q": "Kako se opisuje džennetski užitak?", "a": "Ono što oko nije vidjelo, uho čulo ni srce zamislilo.", "w": ["Isti kao svakodnevni dunjalučki užitak.", "Ograničen samo na ono što ljudi poznaju.", "Bez ičega novog u odnosu na dunjaluk."]}, {"q": "Kakvi će mirisi biti u Džennetu?", "a": "Mirisi koji se osjećaju na četrdeset godina hoda.", "w": ["Mirisi koji se ne mogu osjetiti.", "Mirisi samo na udaljenosti jednog koraka.", "Mirisi koji brzo nestaju."]}, {"q": "Koliko se džennetskih deredža spominje ?", "a": "Stotinu.", "w": ["Sedam.", "Deset.", "Četrdeset."]}, {"q": "Kako se naziva najviši nivo Dženneta?", "a": "Firdevs.", "w": ["Berzah.", "Mahšer.", "Mizan."]}, {"q": "Gdje se nalazi Firdevs ?", "a": "Ispod Allahovog prijestolja – Arša.", "w": ["Ispod Sirat-ćuprije.", "U berzahu.", "Na dunjaluku."]}, {"q": "Koja je najveća počast za vjernike u Džennetu?", "a": "Gledanje u Allaha, dž.š.", "w": ["Povratak na dunjaluk.", "Ponovno polaganje računa.", "Boravak u kaburu."]}, {"q": "Kakav je najniži stepen Dženneta ?", "a": "Poput dunjaluka i još deset puta toliko.", "w": ["Manji od dunjaluka.", "Jednak jednoj zemaljskoj sobi.", "Bez ikakvih blagodati."]}, {"q": "Jesu li džennetske bašče prolazne?", "a": "Ne, vječne su i neće presušiti ni uvenuti.", "w": ["Da, nestaju nakon jednog dana.", "Da, nestaju nakon sto godina.", "Da, postoje samo na dunjaluku."]}, {"q": "Koliko dugo će vjernici boraviti u Džennetu?", "a": "Vječno.", "w": ["Samo jednu godinu.", "Do prvog novog iskušenja.", "Samo do sljedećeg polaganja računa."]}, {"q": "Šta je pripremljeno za one koji nisu htjeli vjerovati, prema citiranom ajetu?", "a": "Vatra.", "w": ["Džennetske bašče.", "Firdevs.", "Vrelo Kevser."]}, {"q": "Čime će biti napunjen Džehennem?", "a": "Ljudima i kamenjem.", "w": ["Samo vodom.", "Samo voćem i cvijećem.", "Samo zlatom i srebrom."]}, {"q": "Šta se spominje kao hrana u Džehennemu?", "a": "Drvo zekum.", "w": ["Džennetsko voće.", "Med i mlijeko.", "Hljeb i hurme."]}, {"q": "Šta se spominje kao piće u Džehennemu?", "a": "Ključala voda.", "w": ["Voda Kevsera.", "Svježe mlijeko.", "Hladna izvorska voda."]}, {"q": "Koliko puta je džehennemska vatra jača od ovodunjalučke?", "a": "Šezdeset devet puta.", "w": ["Devet puta.", "Dvadeset puta.", "Četrdeset pet puta."]}, {"q": "Koliko vrata ima Džehennem?", "a": "Sedam.", "w": ["Pet.", "Osam.", "Deset."]}, {"q": "Šta se nalazi ispod džehennemskih vrata?", "a": "stepenice", "w": ["rijeke.", "dvorci", "Vrelo"]}, {"q": "Ko čuva Džehennem?", "a": "Grubi i silni meleki.", "w": ["Ljudi koji su prešli Sirat.", "Džennetski stanovnici.", "Svi poslanici."]}, {"q": "Šta će čuvari upitati stanovnike Džehennema?", "a": "Zar im nije došao onaj koji opominje?", "w": ["Jesu li vidjeli Firdevs?", "Koliko su rijeka prešli?", "Jesu li pili sa Havda?"]}, {"q": "Da li će svi vjernici koji budu kažnjeni u Džehennemu ostati vječno?", "a": "Neki će biti izvedeni Allahovom milošću ili šefa’atom.", "w": ["Da, bez izuzetka svi.", "Da, ali samo do Smaka svijeta.", "Ne, svi izlaze bez ikakvog obračuna."]}, {"q": "Ko će vječno boraviti u Džehennemu?", "a": "Nevjernici.", "w": ["Svi vjernici.", "Svi koji su činili dobra djela.", "Svi koji su prošli Sirat-ćupriju."]}, {"q": "Šta može biti razlog izlaska nekih grješnih vjernika iz Džehennema?", "a": "Allahova milost ili šefa’at zagovornika.", "w": ["Njihovo bogatstvo na dunjaluku.", "Njihovo porijeklo.", "Njihov zemaljski položaj."]}, {"q": "Šta nas lekcija uči o djelima na dunjaluku?", "a": "Da se dobrim djelima približavamo Džennetu, a loših se trebamo čuvati.", "w": ["Da djela nemaju nikakvu vrijednost.", "Da se nagrada određuje imetkom.", "Da nema odgovornosti za postupke."]}];const cards=[{"q": "Šta je ahiret?", "a": "Vječni život nakon čovjekovog preseljenja sa dunjaluka."}, {"q": "Kako se u lekciji opisuje dunjaluk?", "a": "Kao putovanje prema ahiretu."}, {"q": "Šta je Džennet?", "a": "Vječno boravište na ahiretu pripremljeno za vjernike."}, {"q": "Šta je Džehennem?", "a": "Boravište na ahiretu pripremljeno za nevjernike, nasilnike i zločince."}, {"q": "Ko će, prema lekciji, stići do Dženneta poslije Sirat-ćuprije?", "a": "Oni koji uspješno pređu Sirat-ćupriju."}, {"q": "Šta se nalazi u Džennetu?", "a": "Rijeke i prostrane odaje."}, {"q": "Kakav je život u Džennetu?", "a": "Ugodan, bez poteškoća."}, {"q": "Šta će vjernici u Džennetu moći dobiti?", "a": "Sve što požele."}, {"q": "Kako se opisuje džennetski užitak?", "a": "Ono što oko nije vidjelo, uho čulo ni srce zamislilo."}, {"q": "Kakvi će mirisi biti u Džennetu?", "a": "Mirisi koji se osjećaju na četrdeset godina hoda."}, {"q": "Koliko se džennetskih deredža spominje u lekciji?", "a": "Stotinu."}, {"q": "Kako se naziva najviši nivo Dženneta?", "a": "Firdevs."}, {"q": "Gdje se nalazi Firdevs prema lekciji?", "a": "Ispod Allahovog prijestolja – Arša."}, {"q": "Koja je najveća počast za vjernike u Džennetu?", "a": "Gledanje u Allaha, dž.š."}, {"q": "Kakav je najniži stepen Dženneta prema lekciji?", "a": "Poput dunjaluka i još deset puta toliko."}, {"q": "Jesu li džennetske bašče prolazne?", "a": "Ne, vječne su i neće presušiti ni uvenuti."}, {"q": "Koliko dugo će vjernici boraviti u Džennetu?", "a": "Vječno."}, {"q": "Šta je pripremljeno za one koji nisu htjeli vjerovati, prema citiranom ajetu?", "a": "Vatra."}, {"q": "Čime će, prema lekciji, biti napunjen Džehennem?", "a": "Ljudima i kamenjem."}, {"q": "Šta se spominje kao hrana u Džehennemu?", "a": "Drvo zekum."}, {"q": "Šta se spominje kao piće u Džehennemu?", "a": "Ključala voda."}, {"q": "Koliko puta je džehennemska vatra jača od ovodunjalučke?", "a": "Šezdeset devet puta."}, {"q": "Koliko vrata ima Džehennem?", "a": "Sedam."}, {"q": "Šta se nalazi ispod džehennemskih vrata, prema lekciji?", "a": "Džehennemske stepenice jedna ispod druge."}, {"q": "Ko čuva Džehennem?", "a": "Grubi i silni meleki."}, {"q": "Šta će čuvari upitati stanovnike Džehennema?", "a": "Zar im nije došao onaj koji opominje?"}, {"q": "Da li će svi vjernici koji budu kažnjeni u Džehennemu ostati vječno?", "a": "Ne, prema lekciji neki će biti izvedeni Allahovom milošću ili šefa’atom."}, {"q": "Ko će, prema lekciji, vječno boraviti u Džehennemu?", "a": "Nevjernici."}, {"q": "Šta može biti razlog izlaska nekih grješnih vjernika iz Džehennema?", "a": "Allahova milost ili šefa’at zagovornika."}, {"q": "Šta nas lekcija uči o djelima na dunjaluku?", "a": "Da se dobrim djelima približavamo Džennetu, a loših se trebamo čuvati."}];let index=0,score=0,deck=[],selected=null,matched=0,lock=false;const v=document.getElementById('view');function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function sound(ok){try{let c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?660:210;g.gain.value=.06;o.start();o.stop(c.currentTime+.14)}catch(e){}}function show(k){if(k==='lesson'){v.innerHTML=`<section class="panel"><h2>Lekcija</h2><p><b>Ahiret</b> je vječni život nakon dunjaluka. Dunjaluk je poput putovanja prema ahiretu. Džennet je vječno boravište pripremljeno za vjernike, a Džehennem je mjesto kazne opisano u lekciji.</p><h2>Džennet</h2><p>U Džennetu su rijeke, prostrane odaje, mirisi i blagodati koje čovjek ne može ni zamisliti. Spominje se stotinu deredža, a najviša je Firdevs, ispod Arša. Najveća počast vjernicima jeste gledanje u Allaha, dž.š. Džennetske bašče ne presušuju, a boravak je vječan.</p><h2>Džehennem</h2><p>U Džehennemu se spominju vatra, drvo zekum, ključala voda, sedam vrata i strogi meleki čuvari. Vatra je opisana kao 69 puta jača od dunjalučke. Lekcija navodi da neki grješni vjernici mogu biti izvedeni Allahovom milošću ili šefa’atom, dok će nevjernici vječno ostati.</p><h2>Zapamti</h2><p>Trudimo se činiti dobra djela koja nas približavaju Džennetu i izbjegavati loša djela.</p></section>`}}function startQuiz(){index=0;score=0;deck=shuffle(data);renderQ()}function renderQ(){if(index>=deck.length){v.innerHTML=`<section class="panel"><h2>Kviz završen</h2><p class="big">Tačno: ${score} / ${deck.length}</p><button onclick="startQuiz()">Igraj ponovo</button></section>`;return}let x=deck[index],opts=shuffle([x.a,...x.w]);v.innerHTML=`<section class="panel"><p>${index+1} / ${deck.length} · Tačno: ${score}</p><h2>${x.q}</h2><div class="answers">${opts.map(a=>`<button class="opt"></button>`).join('')}</div><p id="feedback"></p></section>`;document.querySelectorAll('.opt').forEach((b,i)=>{b.textContent='ABCD'[i]+') '+opts[i];b.onclick=()=>{if(lock)return;lock=true;let ok=opts[i]===x.a;if(ok)score++;sound(ok);b.classList.add(ok?'good':'bad');document.querySelectorAll('.opt').forEach(z=>{z.disabled=true;if(z.textContent.substring(3)===x.a)z.classList.add('good')});document.getElementById('feedback').textContent=ok?'Tačno!':'Tačno je: '+x.a;setTimeout(()=>{lock=false;index++;renderQ()},1400)}})}function startCards(){index=0;deck=shuffle(cards);renderCard(false)}function renderCard(reveal){let x=deck[index];v.innerHTML=`<section class="panel" style="text-align:center"><p>Kartica ${index+1}/${deck.length}</p><h2>${x.q}</h2><div class="panel big">${reveal?x.a:'Pritisni „Prikaži odgovor“'}</div><button onclick="renderCard(true)">Prikaži odgovor</button> <button onclick="index=(index+1)%deck.length;renderCard(false)">Sljedeća</button> <button onclick="index=(index+deck.length-1)%deck.length;renderCard(false)">Prethodna</button></section>`}function startMatch(){let chosen=shuffle(cards).slice(0,6);deck=shuffle(chosen.flatMap((x,i)=>[{id:i,t:x.q},{id:i,t:x.a}]));selected=null;matched=0;renderPairs('Spoji pitanje i odgovor')}function startMemory(){let chosen=shuffle(cards).slice(0,8);deck=shuffle(chosen.flatMap((x,i)=>[{id:i,t:x.q},{id:i,t:x.a}]));selected=null;matched=0;renderPairs('Memori',true)}function renderPairs(title,mem=false){v.innerHTML=`<section class="panel"><h2>${title}</h2><p>Pronađeni parovi: ${matched}/${deck.length/2}</p><div class="pairgrid">${deck.map((x,i)=>`<button class="tile" data-i="${i}">${x.done?'✓':mem?'?':x.t}</button>`).join('')}</div><p id="feedback"></p><button onclick="${mem?'startMemory':'startMatch'}()">Nova igra</button></section>`;document.querySelectorAll('.tile').forEach(b=>{let i=+b.dataset.i,x=deck[i];if(x.done)b.disabled=true;b.onclick=()=>{if(lock||x.done||i===selected)return;b.textContent=x.t;b.classList.add('good');if(selected===null){selected=i;return}let first=deck[selected],j=selected,ok=first.id===x.id;sound(ok);if(ok){first.done=x.done=true;matched++;selected=null;setTimeout(()=>renderPairs(title,mem),450)}else{lock=true;setTimeout(()=>{selected=null;lock=false;renderPairs(title,mem)},1300)}}})}function downloadSelf(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([document.documentElement.outerHTML],{type:'text/html'}));a.download='index.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}show('lesson');</script><script>
show=function(k){if(k!=='lesson')return;v.innerHTML=`<section class="panel"><div class="lesson-hero"><h2>🌿 Džennet i Džehennem</h2><p>Ilmihal 3 · Lekcija 48–49 · Ahiret i odgovornost za djela</p></div><div class="lesson-grid"><article class="lesson-box wide"><h3>Ahiret i dunjaluk</h3><p>Ahiret je vječni život nakon preseljenja sa dunjaluka. Dunjaluk je poput putovanja prema ahiretu, na kojem se čovjek priprema svojim djelima.</p></article><article class="lesson-box"><h3>🌸 Džennet</h3><p>Vječno boravište pripremljeno za vjernike. U njemu su rijeke, prostrane odaje, ugodan život i blagodati koje ljudi ne mogu zamisliti.</p></article><article class="lesson-box"><h3>✨ Džennetske nagrade</h3><p>Spominje se stotinu deredža. Najviša je Firdevs, ispod Arša. Najveća počast vjernicima je gledanje u Allaha, dž.š. Džennetske bašče su vječne.</p></article><article class="lesson-box"><h3>🔥 Džehennem</h3><p>Boravište kazne opisano vatrom, drvetom zekum, ključalom vodom i sedam vrata. Čuvaju ga grubi i silni meleki.</p></article><article class="lesson-box"><h3>🤲 Allahova milost</h3><p>Lekcija navodi da neki grješni vjernici mogu biti izvedeni iz Džehennema Allahovom milošću ili šefa’atom, dok će nevjernici ostati vječno.</p></article><article class="lesson-box wide"><h3>📖 Zapamti</h3><p>Dobrih djela treba se držati jer nas približavaju Džennetu, a loših se čuvati. Za svoja djela čovjek snosi odgovornost.</p></article></div></section>`};
renderCard=function(reveal){let x=deck[index];v.innerHTML=`<section class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2 style="margin:0">Kartice za učenje</h2><b style="color:#297665">${index+1} / ${deck.length}</b></div><div class="progress-track"><span style="width:${(index+1)/deck.length*100}%"></span></div><div class="card-stage ${reveal?'revealed':''}" id="flipcard" role="button" tabindex="0"><span class="card-label">${reveal?'Odgovor':'Pitanje'}</span><div class="card-content" id="cardtext"></div><small style="color:#65877d">Dodirni karticu za ${reveal?'pitanje':'odgovor'}</small></div><div class="card-actions"><button id="prevcard">← Prethodna</button><button id="flipbtn">${reveal?'Prikaži pitanje':'Prikaži odgovor'}</button><button id="nextcard">Sljedeća →</button></div></section>`;document.getElementById('cardtext').textContent=reveal?x.a:x.q;const flip=()=>renderCard(!reveal);document.getElementById('flipcard').onclick=flip;document.getElementById('flipcard').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}};document.getElementById('flipbtn').onclick=flip;document.getElementById('prevcard').onclick=()=>{index=(index+deck.length-1)%deck.length;renderCard(false)};document.getElementById('nextcard').onclick=()=>{index=(index+1)%deck.length;renderCard(false)}};
show('lesson');
</script></body></html>
